name: 특징주 수집 (한국 러너)

# ───────────────────────────────────────────────
#  왜 이 워크플로가 따로 있는가
#
#  토스 Open API 는 **해외 IP 를 403 으로 막는다** (실측).
#  기본 수집(collect.yml)은 GitHub 호스팅 러너(미국)에서 돌기 때문에
#  토스로는 분봉을 못 받는다. 매크로는 야후, 일봉은 pykrx 로 우회해 뒀지만
#  **장중 1분·5분봉만은 우회할 방법이 없다** — 토스만 준다.
#
#  그래서 이 워크플로는 **사용자 PC(한국)를 self-hosted 러너로 등록**해 돌린다.
#  그러면 장중 분봉 + 장중 대장주 교체 추적까지 리포트에 들어온다.
#
#  ── 러너 등록 (한 번만) ───────────────────────
#   1) 레포 → Settings → Actions → Runners → New self-hosted runner → Windows
#   2) 화면에 나오는 명령을 PowerShell 에 그대로 붙여 넣는다
#   3) 서비스로 돌리려면:  .\svc.ps1 install  후  .\svc.ps1 start
#   4) 러너 PC 에 환경변수를 심는다 (setx 후 러너 재시작)
#        setx KRX_ID "아이디"     / setx KRX_PW "비밀번호"
#        setx TOSS_CLIENT_ID "..." / setx TOSS_CLIENT_SECRET "..."
#      ※ 시크릿으로도 들어가지만, 러너 PC 에 직접 심어두면 로컬 실행과 같아진다
#
#  ── 자동 실행으로 바꾸기 ──────────────────────
#  러너가 Idle 로 뜨는 것을 확인한 뒤 아래 schedule 주석을 풀면 된다.
#  **러너를 등록하기 전에 schedule 을 켜면** 받아줄 러너가 없어 작업이 큐에
#  쌓인 채 24시간 뒤 실패한다. 그래서 기본은 수동 실행만 열어 둔다.
# ───────────────────────────────────────────────

on:
  workflow_dispatch:
  # schedule:
  #   - cron: "*/30 0-6 * * 1-5"   # 09:00~15:30 KST 30분마다 (UTC+9)
  #   - cron: "35 7 * * 1-5"       # 16:35 KST 종가 확정

permissions:
  contents: write

concurrency:
  group: collect                  # 기본 수집과 같은 그룹 — 동시 실행만 막는다
  cancel-in-progress: false

jobs:
  collect:
    runs-on: self-hosted
    timeout-minutes: 20
    defaults:
      run:
        # Windows 러너의 기본 셸은 PowerShell 이다. 아래 스텝은 bash 문법이고
        # 기본 수집(collect.yml)과 같은 스크립트를 쓰려면 셸도 같아야 한다.
        # Git for Windows 가 깔려 있으면 bash 가 있다 (checkout 이 git 을 요구한다)
        shell: bash
    env:
      TZ: Asia/Seoul
      KRX_ID: ${{ secrets.KRX_ID }}
      KRX_PW: ${{ secrets.KRX_PW }}
      TOSS_CLIENT_ID: ${{ secrets.TOSS_CLIENT_ID }}
      TOSS_CLIENT_SECRET: ${{ secrets.TOSS_CLIENT_SECRET }}
      PYTHONUTF8: "1"

    steps:
      - uses: actions/checkout@v4

      # 러너 서비스의 PATH 에 파이썬이 없을 수 있다 (사용자 PC 설치 경로는 PATH 밖).
      # setup-python 은 self-hosted 에서도 돌아가며 받은 파이썬을 PATH 에 넣어 준다
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 의존성 설치
        run: pip install -r requirements.txt

      # 토스가 붙었는지는 수집 로그에서 바로 보인다 —
      # 해외 IP 면 toss.py 가 "토스 403 — 해외 IP 차단" 을 한 번 찍고 넘어간다
      - name: 수집
        run: python app/pipeline.py

      - name: 정적 사이트 빌드
        run: python app/build_static.py

      - name: 결과 커밋
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase --autostash origin main
          git add app/data docs
          if git diff --cached --quiet; then
            echo "변경 없음 — 휴장일이거나 자료가 같습니다."
            exit 0
          fi
          git commit -m "자동수집(한국 러너) $(date '+%Y-%m-%d %H:%M')"
          git push
