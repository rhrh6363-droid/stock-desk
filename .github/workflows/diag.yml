name: 진단 - 토스 해외IP 확인

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TOSS_CLIENT_ID: ${{ secrets.TOSS_CLIENT_ID }}
      TOSS_CLIENT_SECRET: ${{ secrets.TOSS_CLIENT_SECRET }}
    steps:
      - name: 런너 위치
        run: curl -s --max-time 15 https://ipinfo.io/json | head -c 300

      - name: 토스 토큰 발급 응답 전문
        run: |
          echo "--- POST /oauth2/token ---"
          curl -s -i --max-time 20 \
            -X POST https://openapi.tossinvest.com/oauth2/token \
            -H "Content-Type: application/x-www-form-urlencoded" \
            --data-urlencode "grant_type=client_credentials" \
            --data-urlencode "client_id=$TOSS_CLIENT_ID" \
            --data-urlencode "client_secret=$TOSS_CLIENT_SECRET" \
            | head -c 1200
          echo ""
          echo "--- 도메인 자체 도달 여부 (키 없이) ---"
          curl -s -o /dev/null -w "GET / : HTTP %{http_code}  %{time_total}s\n" \
            --max-time 20 https://openapi.tossinvest.com/
