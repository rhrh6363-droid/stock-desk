# ============================================================
#  진단 — KRX 업종 분류를 받을 수 있는가 (손으로만 돌린다)
# ============================================================
#  로컬에는 KRX 로그인이 없어 검증할 수 없다. pykrx 는 import 할 때
#  KRX_ID / KRX_PW 로 직접 로그인하므로 **런너에서만** 확인된다.
#  검증 없이 파이프라인에 넣지 않는다 — 여기서 모양을 먼저 본다.
#
#  확인이 끝나면 이 워크플로와 app/probe_industry.py 를 지운다.
# ============================================================
name: 진단 - KRX 업종

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TZ: Asia/Seoul
      KRX_ID: ${{ secrets.KRX_ID }}
      KRX_PW: ${{ secrets.KRX_PW }}
      PYTHONUTF8: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: 업종 분류 진단
        run: python app/probe_industry.py
