<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>교재 장별 분석</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#eef1f5; --surface:#fff; --surface-2:#f3f5f8; --line:#d5dce5; --line-soft:#e6ebf1;
  --ink:#131821; --ink-2:#4a5565; --ink-3:#78849a;
  --navy:#1f3864; --navy-2:#2c4e8a;
  --up:#d2342c; --down:#2560c0; --flat:#6b7480;
  --ok:#1d6b3f; --mid:#a8740a; --bad:#c0392b;
  --ok-bg:#e6f3ec; --mid-bg:#fbf1dc; --bad-bg:#fbe7e5;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d1016; --surface:#151a22; --surface-2:#1c222c; --line:#2a323f; --line-soft:#212832;
  --ink:#e7ecf3; --ink-2:#a6b1c2; --ink-3:#768396;
  --navy:#6f9ae0; --navy-2:#8fb4ee;
  --up:#f2635a; --down:#5e9bf0; --flat:#8b95a3;
  --ok:#5cc189; --mid:#e3b04b; --bad:#f2786e;
  --ok-bg:#16291f; --mid-bg:#2c2412; --bad-bg:#2e1716;
}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"IBM Plex Sans KR","Malgun Gothic",system-ui,sans-serif;font-size:14px;line-height:1.6}
.num{font-family:"IBM Plex Mono",ui-monospace,Consolas,monospace;font-variant-numeric:tabular-nums}
a{color:var(--navy)}

.topbar{background:var(--navy);color:#fff;padding:0 16px;display:flex;align-items:center;gap:14px;
  flex-wrap:wrap;position:sticky;top:0;z-index:20}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .topbar{background:#1a2840}}
.brand{font-weight:600;font-size:15px;padding:11px 0}
.back{color:#c6d4ea;font-size:12.5px;text-decoration:none}
.back:hover{color:#fff}
.topbar .right{margin-left:auto;font-size:12px;color:#c6d4ea}
.topbar .right b{color:#fff}

.chnav{display:flex;flex-wrap:wrap;gap:4px;padding:10px 16px;background:var(--surface);
  border-bottom:1px solid var(--line);position:sticky;top:44px;z-index:19}
.chnav button{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--ink-2);
  font:inherit;font-size:12.5px;padding:5px 10px;cursor:pointer}
.chnav button b{color:var(--ink);margin-right:3px}
.chnav button:hover{border-color:var(--navy)}
.chnav button[aria-current="true"]{background:var(--navy);border-color:var(--navy);color:#fff}
.chnav button[aria-current="true"] b{color:#fff}
.chnav .sep{width:1px;background:var(--line);margin:2px 4px}

.wrap{max-width:1100px;margin:0 auto;padding:18px 16px 70px}
h1{font-size:22px;margin:4px 0 2px}
h1 .no{color:var(--navy);margin-right:8px}
.lede{color:var(--ink-2);margin:0 0 14px;max-width:820px}
.flow{font-size:12px;color:var(--ink-3);margin-bottom:16px}
.flow span{padding:2px 7px;border:1px solid var(--line-soft);margin-right:3px;white-space:nowrap;display:inline-block;margin-bottom:3px}
.flow span.on{border-color:var(--navy);color:var(--navy);font-weight:600}

.pick{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:0 0 16px}
.pick .lb{font-size:12px;color:var(--ink-3);margin-right:4px}
.pick button{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);
  font:inherit;font-size:13px;padding:6px 12px;cursor:pointer}
.pick button[aria-pressed="true"]{border-color:var(--navy);box-shadow:inset 0 -3px 0 var(--navy);font-weight:600}
.pick .px{font-size:12px;margin-left:6px}

.card{background:var(--surface);border:1px solid var(--line);margin-bottom:18px}
.card h2{font-size:15px;margin:0;padding:11px 14px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.card h2 .sub{font-size:12px;font-weight:400;color:var(--ink-3)}
.card .body{padding:12px 14px}
.card p{margin:0 0 8px}
.card p:last-child{margin-bottom:0}

table{width:100%;border-collapse:collapse}
th{background:var(--surface-2);color:var(--ink-2);font-size:11.5px;font-weight:600;
  padding:7px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--line-soft);vertical-align:top;font-size:13px}
tr:last-child td{border-bottom:none}
td.k{font-weight:600;white-space:nowrap}
td.k .ref{display:block;font-weight:400;font-size:11px;color:var(--ink-3)}
td.v{white-space:nowrap}
td.rule{color:var(--ink-2);font-size:12.5px;min-width:200px}
td.read{min-width:220px}
td.r{text-align:right}
.scroll{overflow-x:auto}
tr.group td{background:var(--surface-2);font-weight:600;font-size:12.5px;color:var(--navy);padding:7px 10px}

.t{display:inline-block;font-size:11.5px;font-weight:700;padding:1px 7px;white-space:nowrap}
.t.g{background:var(--ok-bg);color:var(--ok)}
.t.w{background:var(--mid-bg);color:var(--mid)}
.t.b{background:var(--bad-bg);color:var(--bad)}
.t.n{background:var(--surface-2);color:var(--ink-3)}
.up{color:var(--up)} .down{color:var(--down)}
.muted{color:var(--ink-3)}
.small{font-size:12px}

.box{border-left:4px solid var(--navy);background:var(--surface-2);padding:10px 14px;margin:0 0 12px;font-size:13px}
.box.b{border-left-color:var(--bad)} .box.g{border-left-color:var(--ok)} .box.w{border-left-color:var(--mid)}
.big{font-size:17px;font-weight:700}

.meth{border:1px solid var(--line);margin-bottom:12px}
.meth .hd{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:9px 12px;background:var(--surface-2);border-bottom:1px solid var(--line)}
.meth .hd .nm{font-weight:700;font-size:14px}
.meth .hd .meta{font-size:12px;color:var(--ink-3)}
.meth .hd .r{margin-left:auto}
.meth .why{padding:8px 12px;font-size:12.5px;color:var(--ink-2);border-bottom:1px solid var(--line-soft)}
.meth.shut{opacity:.7}

.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}
.mini{border:1px solid var(--line);padding:10px 12px;font-size:13px}
.mini h3{font-size:13.5px;margin:0 0 6px}
.mini dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:3px 10px}
.mini dt{color:var(--ink-3);font-size:12px;white-space:nowrap}
.mini dd{margin:0}

.calc{display:flex;flex-wrap:wrap;gap:10px;align-items:end;margin-top:8px}
.calc label{font-size:12px;color:var(--ink-3);display:flex;flex-direction:column;gap:3px}
.calc input{font:inherit;font-size:13px;padding:5px 8px;width:140px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.calc .out{font-size:13px;padding:6px 0}

.notice{padding:30px;text-align:center;color:var(--ink-3)}
ul.plain{margin:4px 0 0;padding-left:18px}
ul.plain li{margin-bottom:3px}
.pager{display:flex;justify-content:space-between;gap:10px;margin-top:20px}
.pager button{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--navy);font:inherit;padding:8px 14px;cursor:pointer}
.pager button[disabled]{visibility:hidden}

@media (max-width:640px){
  .chnav{top:0;position:static}
  td.rule,td.read{min-width:160px}
  h1{font-size:19px}
}
</style>
</head>
<body>

<div class="topbar">
  <span class="brand">교재 장별 분석</span>
  <a class="back" href="index.html">← 일일보고서</a>
  <span class="right" id="stamp">—</span>
</div>
<nav class="chnav" id="chnav" aria-label="장 선택"></nav>

<main class="wrap" id="main"><div class="notice">불러오는 중…</div></main>

<script>
const $=(s)=>document.querySelector(s);
const esc=(s)=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt=(v,d=0)=>v===null||v===undefined||Number.isNaN(Number(v))?"—":Number(v).toLocaleString("ko-KR",{minimumFractionDigits:d,maximumFractionDigits:d});
const won=(v)=>v===null||v===undefined?"—":fmt(v,0)+"원";
const sgn=(v,d=1)=>v===null||v===undefined?"—":(v>0?"+":"")+fmt(v,d)+"%";
const shares=(v)=>v===null||v===undefined?"—":(v>0?"+":"")+fmt(v,0)+"주";
const T=(tone,txt)=>`<span class="t ${tone}">${esc(txt)}</span>`;
const yes=(b,y="예",n="아니오")=>b===true?y:b===false?n:"—";
const gap=(a,b)=>a&&b?(a/b-1)*100:null;

let DATA=null, TF=null, MK=null, DD={}, CUR={ch:10, code:null};

/* 표 한 줄: 항목 · 오늘 값 · 교재 기준 · 읽는 법 */
function row(label, ref, value, rule, tone, reading){
  return `<tr><td class="k">${esc(label)}${ref?`<span class="ref">${esc(ref)}</span>`:""}</td>
    <td class="v num">${value}</td><td class="rule">${esc(rule)}</td>
    <td class="read">${tone&&tone!=="n"?T(tone,{g:"좋음",w:"주의",b:"나쁨"}[tone])+" ":""}${reading}</td></tr>`;
}
const grp=(t)=>`<tr class="group"><td colspan="4">${esc(t)}</td></tr>`;
function factTable(rows){
  return `<div class="scroll"><table><thead><tr><th>항목</th><th>오늘 값</th><th>교재 기준</th><th>읽는 법</th></tr></thead><tbody>${rows.join("")}</tbody></table></div>`;
}
function card(title, sub, body){
  return `<section class="card"><h2>${title}${sub?` <span class="sub">${sub}</span>`:""}</h2><div class="body">${body}</div></section>`;
}
function toolTable(rows){
  const st={"●":["g","계산함"],"◐":["w","근사"],"○":["n","미구현"],"✕":["b","데이터 없음"],"원칙":["n","원칙만"]};
  return `<div class="scroll"><table><thead><tr><th>교재</th><th>도구</th><th>상태</th><th>비고</th></tr></thead><tbody>${
    rows.map(([a,b,c,d])=>{const s=st[c];return `<tr><td class="k">${esc(a)}</td><td>${esc(b)}</td><td>${s?T(s[0],c+" "+s[1]):T("w",c)}</td><td class="small">${esc(d)}</td></tr>`;}).join("")
  }</tbody></table></div>`;
}

/* ── 지수 · 종목 공통 ── */
const idxOf=(s)=>String(s?.심볼||"").endsWith(".KQ")?MK?.코스닥:MK?.코스피;
const stock=()=>(TF?.종목||[]).find(s=>s.코드===CUR.code)||(TF?.종목||[])[0];

/* ───────────────────────── 장 정의 ───────────────────────── */
const CH=[
{n:0, t:"세팅", short:"세팅",
 role:"무엇을 화면에 띄우고 무엇을 기준선으로 쓰는지 정하는 장입니다. 여기서 정한 프레임·이평선·지수가 1장부터 10장까지 모든 계산의 바탕입니다.",
 stock:false, render(){
  const rows=[
    ["남길 것","0-2 §8","주가 + 이평선 + 거래량만 있으면 된다","그대로 따릅니다. 1장이 이 셋으로 계산합니다."],
    ["이평선","0-2 §10 · 10-3 §3","기본 5·20·60·120, 최소 20선 하나","일봉 5·10·20·60·120·240선, 주봉 5·10·13·20·60·120주선, 월봉 18·20·60·120월선을 계산합니다."],
    ["지울 것","0-2 §4","일목·볼린저·스토캐스틱. 이평선이 많으면 손절이 밀린다","볼린저는 주봉에서 '벌어졌다 모이는지' 판정에만 씁니다(4장). 일봉 볼린저 매매 신호는 만들지 않습니다."],
    ["스케일","0-2 PART C","로그 차트","숫자로 계산하므로 해당 없음. 그림 차트는 일일보고서 쪽 캔들에서 봅니다."],
    ["지수","0-1 §11 · 0-2 §10","코스피·코스닥 두 개. 지수가 더 중요하다","9장 페이지가 두 지수를 따로 판정합니다."],
    ["프레임 순서","1-14 §0","월봉 = 지도, 주봉 = 전략, 일봉 = 전술, 60분 = 보완, 분봉 = 실행","1장 페이지가 이 순서(큰 것 → 작은 것)로 보여 줍니다."],
    ["기준 프레임","10-3 §11","초단타 3분봉 20선 / 스윙 일봉 20선 / 중기 주봉 / 중장기 월봉 60·120월선",`기본 스타일: <b>${esc(MK["기본 스타일"]||"")}</b> — 7장 페이지에 고른 이유가 있습니다.`],
  ];
  const t1=`<div class="scroll"><table><thead><tr><th>항목</th><th>교재</th><th>교재가 정한 것</th><th>이 시스템에서</th></tr></thead><tbody>${
    rows.map(r=>`<tr><td class="k">${esc(r[0])}</td><td class="small muted">${esc(r[1])}</td><td class="rule">${esc(r[2])}</td><td>${r[3]}</td></tr>`).join("")}</tbody></table></div>`;

  const fr=["월봉","주봉","일봉","60분봉","5분봉"];
  const need={월봉:[120,"120월선을 그리려면 120개 필요"],주봉:[120,"120주선에 120개"],일봉:[250,"1년선·250일 매물대에 250개"],"60분봉":[120,"기준 60분봉 탐색에 120개"],"5분봉":[20,"당일 분봉 20개 이상"]};
  const t2=`<div class="scroll"><table><thead><tr><th>종목</th>${fr.map(f=>`<th>${f}</th>`).join("")}</tr></thead><tbody>${
    (TF.종목||[]).map(s=>{const f=s["0장 프레임"]||{};return `<tr><td class="k">${esc(s.이름)}<span class="ref">${esc(s.코드)}</span></td>${
      fr.map(k=>{const v=f[k];const ok=v>=need[k][0];return `<td class="num">${fmt(v)} ${v==null?"":ok?T("g","충분"):T("w","부족")}</td>`;}).join("")}</tr>`;}).join("")
  }</tbody></table></div><p class="small muted" style="margin-top:8px">필요 개수: ${fr.map(k=>`${k} ${need[k][0]}개(${need[k][1]})`).join(" · ")}</p>`;

  const src=[
    ["네이버 차트","국내 일봉(2014~)·주봉·월봉","●","국내 일·주·월봉 기준 소스. KRX 종가와 맞습니다."],
    ["야후","월봉 장기, 60분봉 730일, 5분봉 60일, 1분봉 7일","●","60분봉·5분봉과 장기 월봉에 씁니다. 야후 일봉 종가는 틀리는 날이 있어 일봉에는 안 씁니다."],
    ["야후","나스닥·S&P·SOX·미 선물·VIX·미10년·원달러·WTI·금·달러인덱스","●","9장 외부 변수"],
    ["네이버 모바일","종목별 외국인·기관·개인 순매수, 외국인 보유율","●","3장 수급"],
    ["KRX(pykrx)","공매도·대차·외인 한도·투자자 세부","✕","로그인이 필요해 못 받습니다."],
    ["네이버 증시자금","예탁금·신용잔고","✕","페이지가 스크립트로 그려져 표가 빈 채로 옵니다."],
    ["DART","재무제표","✕","키를 연결하지 않았습니다."],
    ["경제 캘린더","FOMC·CPI·고용·실적","✕","출처를 연결하지 않았습니다. 직접 확인해야 합니다."],
  ];
  return card("교재가 정한 세팅 → 이 시스템에서","0-1 · 0-2 · 10-3 · 1-14",t1)
   + card("종목별로 받아온 봉 개수","이 개수가 모자라면 해당 이평선·매물대를 계산하지 못합니다",t2)
   + card("데이터 출처","무엇을 받을 수 있고 무엇을 못 받는지",toolTable(src.map(r=>[r[0],r[1],r[2],r[3]])))
   + card("0장의 나머지","",toolTable([
      ["0-1 HTS 화면","보고서 첫 화면 = 지수 두 개 + 대상 종목","원칙","일일보고서 첫 화면이 이 구성입니다."],
      ["0-3 관심종목 운영","비슷한 고점 두 번, 정배열 + 주봉 도지, 10~15개 + 메모","◐","watchlist.csv 로 운영합니다. 메모는 직접 적어야 합니다."],
      ["0-5 상장폐지 필터","동전주·역배열 / 증거금 100%·관리종목·횡령","◐","앞의 둘만 계산할 수 있습니다."]]));
 }},

{n:1, t:"차트의 기본 언어", short:"차트 기본", stock:true,
 role:"캔들·지지와 저항·라운드피겨·매물대·거래량·이평선·이격도·박스·갭을 읽습니다. 1-14가 정한 대로 큰 프레임부터(월봉 → 주봉 → 일봉 → 60분 → 5분) 내려갑니다. 여기서 나온 '사실'이 6~7장 매매법 조건의 재료가 됩니다.",
 render(s){
  const M=s.월봉||{}, W=s.주봉||{}, D=s.일봉||{}, H=s["60분봉"]||{}, F5=s["5분봉(당일)"]||{};
  const c=D.종가??s.현재가;
  const r=[];
  /* 월봉 */
  r.push(grp("월봉 — 지도: 역사 속 어디에 있나 (1-14 · 10-3 §9~10)"));
  const mBroken=[18,20,60,120].filter(n=>M[n+"월선 위"]===false);
  [18,20,60,120].forEach(n=>{
    const up=M[n+"월선 위"];
    r.push(row(`${n}월선`,n===18?"9-1 §12":n>=60?"10-3 §10":"1-14",`${won(M[n+"월선"])} · ${up?"위":"아래"}`,
      n===18?"18월선을 지켜 주는지가 매우 중요하다":n>=60?"60·120월선을 동시에 깨면 중장기도 발을 뺀다":"월봉 이평선은 장기 추세의 바닥선",
      up===false?"b":up?"g":"n", `현재가가 ${n}월선보다 ${sgn(gap(c,M[n+"월선"]))} ${up?"위":"아래"}에 있습니다.`));
  });
  const lo=M["저점 대비(%)"];

}

function verdictTone(v){ return v==="적합"?"g":String(v).startsWith("조건부")?"w":String(v).startsWith("판정불가")?"n":"b"; }
function methodCard(m){
  const opened=new Set(MK["열린 매매법"]||[]);
  const shut=!opened.has(m.매매법)&&!m.매매법.startsWith("중장기");
  const conds=m.조건||[];
  const fail=conds.filter(c=>c.충족===false), na=conds.filter(c=>c.충족===null||c.충족===undefined);
  let why;
  if(m.판정==="적합") why=`조건을 모두 채웠습니다.${shut?" 하지만 <b>오늘 장세가 닫은 매매법</b>이라 진입 후보로 올리지 않습니다.":""}`;
  else if(fail.length) why=`안 맞는 조건 ${fail.length}개: ${fail.map(c=>esc(c.조건)).join(" / ")}.`;
  else why="장 마감 데이터로 판단할 수 있는 조건은 맞지만, 나머지는 판정불가입니다.";
  if(na.length) why+=` <span class="muted">판정불가 ${na.length}개(${na.map(c=>esc(c.조건)).join(", ")}) — ${na.some(c=>/장중|호가/.test(c.근거))?"장중 실시간 조건이라 내일 장중에 직접 확인":"데이터가 없음"}.</span>`;
  if(shut&&m.판정!=="적합") why+=` <span class="muted">오늘 장세(${esc(MK["가장 나쁜 장세"])})가 닫은 매매법이기도 합니다.</span>`;
  return `<div class="meth ${shut?"shut":""}"><div class="hd"><span class="nm">${esc(m.매매법)}</span>
      <span class="meta">${esc(m.교재)} · ${esc(m.스타일)} · ${esc(m.프레임)}</span>
      <span class="r">${shut?T("n","장세가 닫음")+" ":T("g","오늘 열림")+" "}${T(verdictTone(m.판정),m.판정)} <span class="muted small">${esc(m.충족)} 충족</span></span></div>
    <div class="why">${why}</div>
    <div class="scroll"><table><thead><tr><th>조건</th><th>결과</th><th>근거(오늘 값)</th></tr></thead><tbody>${
      conds.map(c=>`<tr><td>${esc(c.조건)}</td><td>${c.충족===true?T("g","맞음"):c.충족===false?T("b","안 맞음"):T("n","판정불가")}</td><td class="small">${esc(c.근거)}</td></tr>`).join("")
    }</tbody></table></div></div>`;
}
function methodsPage(ch,s){
  const ms=(s.매매법||[]).filter(ch.methods);
  const opened=new Set(MK["열린 매매법"]||[]);
  ms.sort((a,b)=>(opened.has(b.매매법)-opened.has(a.매매법)));
  const cnt={};ms.forEach(m=>{const k=verdictTone(m.판정);cnt[k]=(cnt[k]||0)+1;});
  return ch.intro()
   + card(`${esc(s.이름)} — 매매법 ${ms.length}개 판정`,`적합 ${cnt.g||0} · 조건부 ${cnt.w||0} · 부적합 ${cnt.b||0} · 판정불가 ${cnt.n||0}. 손절·목표·예상 결과는 8장에 있습니다`,
     ms.map(methodCard).join("")||`<p class="muted">해당 매매법이 없습니다.</p>`);
}

function bindCalc(){

  const s=stock(), px=(s.일봉||{}).종가??s.현재가;
  const f=()=>{const a=Number(b1.value.replace(/,/g,"")),b=Number(b2.value.replace(/,/g,""));
    if(!a||!b){o.textContent=`값을 넣으면 현재가 ${fmt(px)}원 기준으로 계산합니다. 입력값은 저장하지 않습니다.`;return;}

    const k=(a-b)/(a-px);

}

  const pick=ch.stock?`<div class="pick"><span class="lb">종목</span>${(TF.종목||[]).filter(x=>!x.상태).map(x=>`<button data-code="${esc(x.코드)}" aria-pressed="${x.코드===s?.코드}">${esc(x.이름)}<span class="px ${x.등락률>0?"up":x.등락률<0?"down":""}">${sgn(x.등락률,2)}</span></button>`).join("")}</div>`:"";
  let body;
  if(ch.stock&&!s) body=`<div class="notice">대상 종목이 없습니다.</div>`;
  else if(ch.methods) body=methodsPage(ch,s);
  else body=ch.render(s);
  const prev=CH[CH.indexOf(ch)-1], next=CH[CH.indexOf(ch)+1];
  $("#main").innerHTML=`<h1><span class="no">${ch.n}장</span>${esc(ch.t)}</h1><p class="lede">${esc(ch.role)}</p>${flow}${pick}${body}
    <div class="pager"><button data-ch="${prev?.n??""}" ${prev?"":"disabled"}>← ${prev?`${prev.n}장 ${esc(prev.short)}`:""}</button>
      <button data-ch="${next?.n??""}" ${next?"":"disabled"}>${next?`${next.n}장 ${esc(next.short)}`:""} →</button></div>`;

function go(ch,code){
  if(ch!==undefined) CUR.ch=ch;

  render();
}
function readHash(){
  const m=location.hash.match(/^#c(\d+)(?:\/(\w+))?/);
  if(m){CUR.ch=Number(m[1]); if(m[2]) CUR.code=m[2];}
}
document.addEventListener("click",e=>{
  const b=e.target.closest("button[data-ch],button[data-code]"); if(!b) return;
  if(b.dataset.code){go(undefined,b.dataset.code);return;}
  if(b.dataset.ch!==""){go(Number(b.dataset.ch)); window.scrollTo(0,0);}
});
window.addEventListener("hashchange",()=>{readHash();render();});

async function getJSON(){
  try{const r=await fetch("/api/latest"); if(r.ok) return await r.json();}catch(e){}
  const r=await fetch("data/latest.json?t="+Date.now());
  if(!r.ok) throw new Error("data/latest.json 을 읽지 못했습니다");
  return await r.json();
}
(async()=>{
  try{
    DATA=await getJSON();
    TF=DATA.교재흐름; MK=TF?.["9장 시장"];
    if(!TF||!MK){$("#main").innerHTML=`<div class="notice">교재 분석 자료가 아직 없습니다. 다음 수집을 기다리세요.</div>`;return;}
    (DATA.심층분석?.종목||[]).forEach(d=>DD[d.코드]=d);
    $("#stamp").innerHTML=`기준일 <b>${esc(TF.기준일)}</b> · 생성 ${esc(TF.생성시각||"")}`;
    readHash(); go();
  }catch(e){ $("#main").innerHTML=`<div class="notice">자료를 읽지 못했습니다: ${esc(e.message)}</div>`; }
})();
</script>
